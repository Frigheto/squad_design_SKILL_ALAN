<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zent Growth — Post Instagram</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ── Tokens extraídos de zentgrowth.com ── */
    :root {
      --color-primary:      #6366f1;
      --color-secondary:    #8b5cf6;
      --color-tertiary:     #a855f7;
      --color-pink:         #ec4899;
      --color-indigo:       #4f46e5;
      --color-violet:       #7c3aed;
      --color-surface:      #ffffff;
      --color-text:         #1f2937;
      --color-text-muted:   #9ca3af;
      --color-border:       #e5e7eb;

      --font-family:        'Inter', system-ui, -apple-system, sans-serif;

      --radius-none:        0px;
      --radius-xs:          2px;
      --radius-sm:          4px;
      --radius-md:          6px;
      --radius-lg:          8px;
      --radius-xl:          12px;
      --radius-full:        9999px;

      --space-xs:           4px;
      --space-sm:           8px;
      --space-md:           16px;
      --space-lg:           24px;
      --space-xl:           32px;
      --space-2xl:          48px;

      --shadow-standard:    0px 1px 3px rgba(0,0,0,0.08), 0px 4px 12px rgba(0,0,0,0.06);
      --shadow-elevated:    0px 4px 16px rgba(0,0,0,0.15), 0px 12px 36px rgba(0,0,0,0.12);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      background: #0f0f1a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-family);
    }

    /* ── Canvas do post ── */
    .post {
      width: 1080px;
      height: 1350px;
      position: relative;
      overflow: hidden;
      background: linear-gradient(
        145deg,
        var(--color-primary) 0%,
        var(--color-secondary) 40%,
        var(--color-tertiary) 75%,
        var(--color-pink) 100%
      );
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 72px 80px;
    }

    /* ── Ruído sutil de textura ── */
    .post::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: 200px 200px;
      opacity: 0.5;
      pointer-events: none;
    }

    /* ── Orbs de luz no fundo ── */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
    }

    .orb-1 {
      width: 500px;
      height: 500px;
      background: rgba(99, 102, 241, 0.4);
      top: -100px;
      right: -100px;
    }

    .orb-2 {
      width: 400px;
      height: 400px;
      background: rgba(236, 72, 153, 0.25);
      bottom: 100px;
      left: -80px;
    }

    .orb-3 {
      width: 300px;
      height: 300px;
      background: rgba(139, 92, 246, 0.3);
      bottom: -50px;
      right: 100px;
    }

    /* ── Header — logo ── */
    .header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 10;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .logo-icon svg {
      width: 22px;
      height: 22px;
      fill: #ffffff;
    }

    .logo-text {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.01em;
      font-feature-settings: 'ss01';
    }

    .badge {
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: var(--radius-full);
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    /* ── Conteúdo central ── */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-2xl);
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 48px 0;
    }

    /* ── Ícone central ── */
    .icon-container {
      width: 120px;
      height: 120px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(16px);
      border-radius: 32px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-elevated), 0 0 60px rgba(99, 102, 241, 0.4);
    }

    .icon-container svg {
      width: 60px;
      height: 60px;
      stroke: #ffffff;
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ── Texto ── */
    .text-block {
      display: flex;
      flex-direction: column;
      gap: var(--space-lg);
      max-width: 800px;
    }

    .headline {
      font-size: 80px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.05;
      letter-spacing: -0.03em;
      font-feature-settings: 'ss01';
    }

    .subheadline {
      font-size: 28px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.82);
      line-height: 1.45;
      letter-spacing: -0.01em;
      max-width: 680px;
      margin: 0 auto;
    }

    /* ── Cards de feature ── */
    .features {
      display: flex;
      gap: var(--space-md);
      width: 100%;
    }

    .feature-card {
      flex: 1;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: var(--radius-xl);
      padding: var(--space-lg) var(--space-md);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-sm);
      box-shadow: var(--shadow-standard);
    }

    .feature-icon {
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, 0.18);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .feature-icon svg {
      width: 22px;
      height: 22px;
      stroke: #ffffff;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .feature-label {
      font-size: 15px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.9);
      text-align: center;
      line-height: 1.3;
    }

    /* ── Footer — CTA ── */
    .footer {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-lg);
      position: relative;
      z-index: 10;
    }

    .cta-button {
      background: #ffffff;
      color: var(--color-primary);
      font-family: var(--font-family);
      font-size: 22px;
      font-weight: 700;
      padding: 20px 64px;
      border-radius: var(--radius-full);
      border: none;
      cursor: pointer;
      letter-spacing: -0.01em;
      box-shadow: 0px 8px 32px rgba(0, 0, 0, 0.2), 0px 2px 8px rgba(0, 0, 0, 0.12);
      font-feature-settings: 'ss01';
    }

    .instagram-handle {
      font-size: 16px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.55);
      letter-spacing: 0.01em;
    }
  </style>
</head>
<body>
  <div class="post">

    <!-- Orbs de fundo -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <!-- Header -->
    <div class="header">
      <div class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </div>
        <span class="logo-text">Zent Growth</span>
      </div>
      <div class="badge">ZENT A.I.</div>
    </div>

    <!-- Conteúdo central -->
    <div class="content">

      <!-- Ícone central -->
      <div class="icon-container">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
          <path d="M14 17.5h7M17.5 14v7"/>
        </svg>
      </div>

      <!-- Headline e subheadline -->
      <div class="text-block">
        <h1 class="headline">Organize seu<br>negócio.</h1>
        <p class="subheadline">Gestão inteligente para empresas que querem crescer de verdade.</p>
      </div>

      <!-- Cards de features -->
      <div class="features">
        <div class="feature-card">
          <div class="feature-icon">
            <svg viewBox="0 0 24 24"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
          </div>
          <span class="feature-label">Análise em<br>tempo real</span>
        </div>
        <div class="feature-card">
          <div class="feature-icon">
            <svg viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          </div>
          <span class="feature-label">Automação<br>inteligente</span>
        </div>
        <div class="feature-card">
          <div class="feature-icon">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
          </div>
          <span class="feature-label">Gestão<br>eficiente</span>
        </div>
      </div>

    </div>

    <!-- Footer -->
    <div class="footer">
      <button class="cta-button">Comece Agora</button>
      <span class="instagram-handle">@zentgrowth</span>
    </div>

  </div>
</body>
</html>
